name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Exercises the Windows-only tools (PowerShell, media keys, screenshots,
  # shutdown scheduling) on a real Windows machine.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Show the latest whisper.cpp release assets (diagnostics)
        run: (Invoke-RestMethod "https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest" -Headers @{ "User-Agent" = "ULTRON-CI" }).assets | ForEach-Object { $_.name }
      - name: Install Whisper (tiny model) with ULTRON's own installer
        run: powershell -ExecutionPolicy Bypass -File scripts/install-whisper.ps1 -Model tiny
      - run: npx tsx scripts/windows-smoke.mts
